name: SentinelAI quality
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: sentinel
          POSTGRES_DB: sentinel
          POSTGRES_PASSWORD: ci-only-disposable-password
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U sentinel"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r apps/api/requirements.lock.txt
      - run: ruff check . && ruff format --check . && pytest -q
        working-directory: apps/api
      - name: PostgreSQL migration and seed
        working-directory: apps/api
        env:
          DATABASE_URL: postgresql+psycopg://sentinel:ci-only-disposable-password@localhost:5432/sentinel
          JWT_SECRET: ci-only-disposable-signing-key-at-least-32-characters
          DEMO_MODE: 'true'
          DEMO_PASSWORD: CI-only-demo-password-426
        run: |
          alembic upgrade head
          python -m app.seed
          alembic check
          uvicorn app.main:app --host 127.0.0.1 --port 8000 > /tmp/sentinel-postgres-api.log 2>&1 &
          cd ../..
          printf '%s\n' 'DEMO_PASSWORD=CI-only-demo-password-426' > .env
          for attempt in $(seq 1 30); do curl -fsS http://localhost:8000/api/v1/health/ready >/dev/null && break; sleep 2; done
          python scripts/verify-demo.py
          python scripts/verify-concurrency.py
      - run: pip install pip-audit && pip-audit -r apps/api/requirements.lock.txt
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci && npm run lint && npm run typecheck && npm run build && npm audit --audit-level=high
        working-directory: apps/web
      - run: pip install -r apps/api/requirements.lock.txt
      - name: Start disposable demo
        run: |
          python scripts/setup-env.py
          python scripts/local.py migrate
          python scripts/local.py seed
          python scripts/local.py api > /tmp/sentinel-api.log 2>&1 &
          cd apps/web
          npm run start > /tmp/sentinel-web.log 2>&1 &
      - run: npx playwright install --with-deps chromium
        working-directory: apps/web
      - run: |
          for attempt in $(seq 1 30); do curl -fsS http://localhost:3000/login >/dev/null && break; sleep 2; done
          python scripts/local.py e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-report
          path: apps/web/playwright-report
  container-builds:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t sentinel-api:ci apps/api
      - run: docker build -t sentinel-web:ci apps/web
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
